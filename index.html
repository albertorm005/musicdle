<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Musicdle</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="style.css">

    <!-- BOOTSTRAP -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container text-center mt-4">

    <!-- HOME -->
    <div id="homeScreen">
        <h1>🎵 Musicdle</h1>
        <p>Elige una época</p>

        <button onclick="selectEra('80s')">🕺 80s</button>
        <button onclick="selectEra('90s')">💿 90s</button>
        <button onclick="selectEra('2000s')">🔥 2000s</button>
        <button onclick="selectEra('2010s')">🎧 2010s</button>
        <button onclick="selectEra('urbana')">🎤 Urbana</button>
        <button onclick="selectEra('mix')">🌍 Mixto</button>
    </div>

    <div id="genreScreen" style="display:none;">
        <h2>🎧 Elige género</h2>

        <button onclick="selectGenre('rock')">🎸 Rock</button>
        <button onclick="selectGenre('pop')">🎤 Pop</button>
        <button onclick="selectGenre('spanish')">🇪🇸 Español</button>
        <button onclick="selectGenre('electronic')">🎧 Electrónica</button>
        <button onclick="selectGenre('all')">🎲 Aleatorio</button>
    </div>

    <!-- GAME -->
    <div id="gameScreen" style="display:none;">

        <h1 class="mb-3">🎵 Musicdle</h1>

        <img id="albumImage" class="img-fluid rounded mb-3">

        <!-- INPUT -->
        <input type="text" id="guessInput" class="form-control mb-2"
               placeholder="Adivina el álbum...">

        <div id="suggestions" class="list-group mb-3"></div>

        <!-- WORDLE -->
        <div id="attemptsContainer" class="d-flex justify-content-center gap-2 mb-3"></div>

        <!-- BOTONES -->
        <div class="d-flex flex-wrap justify-content-center gap-2 mb-3">
            <button class="btn btn-success" onclick="checkGuess()">Enviar</button>
            <button class="btn btn-warning" onclick="giveHint()">Pista</button>
            <button class="btn btn-info" onclick="shareResult()">Compartir</button>
            <button class="btn btn-danger" onclick="goHome()">Salir</button>
        </div>

        <p id="timer">⏱️ 120s</p>

        <!-- VIDAS -->
        <div id="lives" class="mb-2"></div>

        <!-- PROGRESO -->
        <div id="progressContainer" class="mb-2">
            <div id="progressBar"></div>
        </div>
        <p id="progressText"></p>

        <!-- STATS -->
        <p id="stats"></p>
        <p id="streak"></p>

        <p id="result"></p>

        <div id="ranking"></div>

    </div>

</div>

<!-- MODAL -->
<div id="endScreen" class="modal" style="display:none;">
    <div class="modal-content">
        <h2 id="endTitle"></h2>
        <p id="endMessage"></p>

        <button class="btn btn-primary mb-2" onclick="startGame()">Jugar otra vez</button>
        <button class="btn btn-secondary" onclick="goHome()">Salir</button>
    </div>
</div>

<script src="script.js"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

</body>
</html>
